#                                                                        #
# Security policy for the TYPO3 Flow Framework                           #
#                                                                        #
# This file contains the default security policy configuration for the   #
# TYPO3 Flow Framework. Don't modify this file but add configuration     #
# options to the Policy.yaml file in the in global Configuration/        #
# directory instead.                                                     #

privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    fucodo_registry_editor_EditorController:
      matcher: 'method(fucodo\registry\editor\Controller\EditorController->.*())'

roles:
  'fucodo.registry.editor:Editor':
    abstract: 1
    privileges:
      -
        privilegeTarget: fucodo_registry_editor_EditorController
        permission: GRANT
